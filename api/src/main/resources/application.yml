server:
  port: 8081
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldflow}
    username: ${DB_USER:fieldflow}
    password: ${DB_PASSWORD:local-change-me}
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/fieldflow}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8080/realms/fieldflow/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  portal-url: ${PORTAL_URL:http://localhost:3000}
  stripe-secret-key: ${STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  payment-amount-cents: 4900
  payment-currency: eur
