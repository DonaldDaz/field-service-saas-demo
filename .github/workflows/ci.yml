name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - run: mvn test --batch-mode
        working-directory: api

  web-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            technician/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run typecheck && npm run build
        working-directory: portal
      - run: npm ci
        working-directory: technician
      - run: npm run typecheck && npx expo install --check && npx expo export --platform ios
        working-directory: technician

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: npm ci
        working-directory: portal
      - run: npx playwright install --with-deps chromium
        working-directory: portal
      - run: npm run test:e2e
        working-directory: portal
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
